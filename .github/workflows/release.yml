name: "Release"
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Release action to perform"
        type: choice
        options:
          - release-snapshot
          - verify-snapshot
          - release
          - verify
          - publish
      packages_registry:
        description: "Maven packages registry to resolve release dependencies"
        required: true
        type: string
      return_dispatch_repository:
        description: "Repository that handles the return dispatch"
        required: true
        type: string
      return_dispatch_branch:
        description: "Branch that handles the return dispatch"
        required: true
        type: string
      return_dispatch_workflow:
        description: "Workflow that handles the return dispatch"
        required: true
        type: string
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ inputs.action }}"
jobs:
  release:
    name: "Release (${{ inputs.action }})"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Set up Java"
        id: "set-up-java"
        uses: "actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654" # 5.2.0
        with:
          distribution: "liberica"
          java-version: "25"
      - name: "Check Out Code"
        id: "check-out-code"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # 6.0.2
      - name: "Build"
        id: "build"
        if: "${{ inputs.action != 'publish' }}"
        uses: "./.github/actions/build"
        with:
          maven_packages_registry: ${{ inputs.packages_registry }}
          verify: "${{ inputs.action == 'verify-snapshot' || inputs.action == 'verify' }}"
          create_deployment: "${{ inputs.action == 'release-snapshot' || inputs.action == 'release' }}"

name: "Build Snapshot Release"
on:
  workflow_dispatch:
    inputs:
      maven_packages_registry:
        description: "Maven packages registry to resolve release dependencies"
        required: true
        type: string
      return_dispatch_repository:
        description: "Repository that handles the return dispatch"
        required: true
        type: string
      return_dispatch_branch:
        description: "Branch that handles the return dispatch"
        required: true
        type: string
      return_dispatch_workflow:
        description: "Workflow that handles the return dispatch"
        required: true
        type: string
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
jobs:
  build-snapshot-release:
    name: "Build Snapshot Release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Set up Java"
        id: "set-up-java"
        uses: "actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654" # 5.2.0
        with:
          distribution: "liberica"
          java-version: "25"
      - name: "Check Out Code"
        id: "check-out-code"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # 6.0.2
      - name: "Build"
        id: "build"
        uses: "./.github/actions/build"
        with:
          maven_packages_registry: ${{ inputs.maven_packages_registry }}
          verify: "false"
          create_deployment: "true"

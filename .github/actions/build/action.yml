name: build
description: 'Build Project'  
inputs:
  packages_registry:
    description: 'The GitHub packages registry to use for dependencies'
    required: false
  create_deployment:
    description: 'Whether to create the deployment artifacts'
    required: false
  verify:
    description: 'Wheter to verify the build by running tests'
    required: false
runs:
  using: "composite"
  steps:
  - name: "Build"
    id: "build"
    shell: "bash"
    run: $GITHUB_ACTION_PATH/build.sh
    env:
      PACKAGES_REGISTRY: ${{ inputs.packages_registry }}
      CREATE_DEPLOYMENT: ${{ inputs.create_deployment }}
      VERIFY: ${{ inputs.verify }}
